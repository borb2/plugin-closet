name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: PluginCloset
          path: build/libs/*.jar

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as env, not inlined into the script, so a commit message
          # containing quotes or backticks can't break out into the shell.
          TAG: build-${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" build/libs/*.jar \
            --title "Build ${{ github.run_number }}" \
            --notes "$NOTES

          $SHA"
