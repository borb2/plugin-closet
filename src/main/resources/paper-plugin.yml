name: PluginCloset
version: '${version}'
main: me.sirborb.plugincloset.PluginCloset
api-version: '1.21'
# Folia refuses to load any plugin that has not explicitly opted in. Earned here: every
# scheduler call goes through the async or per-entity scheduler, never BukkitScheduler.
folia-supported: true
description: Browse and install plugins from Modrinth and Hangar without leaving the game.
authors: [sirborb]

permissions:
  plugincloset.use:
    description: Open the browser and install plugins.
    default: op
  plugincloset.admin:
    description: Reload config and clear the search cache.
    default: op
